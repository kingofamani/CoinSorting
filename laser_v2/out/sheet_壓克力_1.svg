<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- 分幣機 v2 雷切檔，上雷切機用（laser_v2.build_v2 產生；改 laser_v2/params.py 後重跑，請勿手改）。黑 0.2 mm＝切割；紅 0.2 mm 線＝雕刻，紅色圖層設「線／向量雕刻（低功率切割）」，不要用填色／掃描。不含註記。每個零件先雕刻、切孔與內部線，外框最後切。雷切軟體多半照圖層（顏色）順序跑、不照檔案順序：圖層清單裡把紅色（雕刻）排在黑色（切割）前面，黑色圖層再開「先切內部（inner first）」；不然整張先切穿，小零件來不及雕刻就掉了或移位　壓克力 第 1 張 -->
