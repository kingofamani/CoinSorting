<text x="900" y="656" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffd27a">上傳卡在 Connecting… → 按住 BOOT 鍵</text>
<text x="900" y="678" font-size="13" text-anchor="middle" font-weight="normal" fill="#9ff0a0">EN（RST）鍵＝重開機、自動判定擋住電位</text>
<text x="900" y="698" font-size="13" text-anchor="middle" font-weight="normal" fill="#9ff0a0">（開機約 1 秒，槽裡不能有東西）</text>
