<text x="70" y="312" font-size="15" text-anchor="start" font-weight="bold" fill="#6b5200">CLK→G14 的 S、DIO→G13 的 S</text>
<text x="70" y="334" font-size="15" text-anchor="start" font-weight="bold" fill="#6b5200">VCC→任一 V、GND→任一 G</text>
<text x="70" y="354" font-size="13" text-anchor="start" font-weight="normal" fill="#555">母母杜邦線 4 條</text>
