<text x="875" y="424" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff">S</text>
<text x="875" y="449" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff">V</text>
<text x="875" y="474" font-size="10" text-anchor="middle" font-weight="bold" fill="#fff">G</text>
<text x="1645" y="270" font-size="16" text-anchor="end" font-weight="bold" fill="#6b5200">OUT（DO）→G27 的 S</text>
<text x="1645" y="292" font-size="15" text-anchor="end" font-weight="bold" fill="#6b5200">VCC→同一欄的 V、GND→同一欄的 G</text>
<text x="1645" y="312" font-size="13" text-anchor="end" font-weight="normal" fill="#555">母母杜邦線 3 條（模組腳位順序以實品印字為準）</text>
<rect x="1310" y="390" width="330" height="230" rx="8" fill="#f7f7f7" stroke="#999" stroke-width="2" stroke-dasharray="6,4"/>
<text x="1325" y="416" font-size="15" text-anchor="start" font-weight="bold" fill="#222">裝在原型上時</text>
<text x="1325" y="444" font-size="13" text-anchor="start" font-weight="normal" fill="#222">① 杜邦線先插在模組排針上，再裝模組</text>
<text x="1325" y="466" font-size="13" text-anchor="start" font-weight="normal" fill="#222">　（裝好後排針在背牆後下方，事後難插）</text>
<text x="1325" y="488" font-size="13" text-anchor="start" font-weight="normal" fill="#222">② 線往下走，用紙膠帶固定在底板 A，</text>
<text x="1325" y="510" font-size="13" text-anchor="start" font-weight="normal" fill="#222">　留一點鬆度</text>
<text x="1325" y="532" font-size="13" text-anchor="start" font-weight="normal" fill="#222">③ 不要往背後拉緊：會把模組拉歪，</text>
<text x="1325" y="554" font-size="13" text-anchor="start" font-weight="normal" fill="#222">　光束就對不到光孔</text>
<text x="1325" y="576" font-size="13" text-anchor="start" font-weight="normal" fill="#222">④ 底板要固定在桌上（壓重物或貼膠帶），</text>
<text x="1325" y="598" font-size="13" text-anchor="start" font-weight="normal" fill="#222">　線拉一下整台就可能往後翻</text>
<rect x="110" y="600" width="220" height="140" rx="8" fill="#2f3640" stroke="#333" stroke-width="2"/>
<rect x="124" y="614" width="192" height="112" rx="3" fill="#cfe3f7" stroke="none" stroke-width="0"/>
<text x="220" y="655" font-size="16" text-anchor="middle" font-weight="bold" fill="#1f3b5c">Arduino IDE</text>
<text x="220" y="680" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f3b5c">序列埠 115200</text>
<text x="220" y="702" font-size="13" text-anchor="middle" font-weight="normal" fill="#1f3b5c">c20 / e / v / ?</text>
<path d="M 90 740 L 350 740 L 370 762 L 70 762 Z" fill="#596275" stroke="#333" stroke-width="2"/>
<text x="220" y="784" font-size="15" text-anchor="middle" font-weight="bold" fill="#222">電腦</text>
<polyline points="350,690 470,690 470,656 708,656" fill="none" stroke="#6b6b6b" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
<text x="360" y="680" font-size="14" text-anchor="start" font-weight="bold" fill="#222">USB 線</text>
<text x="220" y="804" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">USB 線要能傳資料（不是只能充電的那種）</text>
<text x="220" y="822" font-size="12" text-anchor="middle" font-weight="normal" fill="#555">供電、上傳程式、看序列埠都靠這條</text>
<line x1="40" y1="836" x2="1620" y2="836" stroke="#ccc" stroke-width="1"/>
<text x="60" y="868" font-size="18" text-anchor="start" font-weight="bold" fill="#222">線色</text>
<polyline points="70,900 120,900" fill="none" stroke="#D7263D" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="70" cy="900" r="4.5" fill="#D7263D" stroke="#000" stroke-width="1"/>
<circle cx="120" cy="900" r="4.5" fill="#D7263D" stroke="#000" stroke-width="1"/>
<text x="135" y="905" font-size="15" text-anchor="start" font-weight="normal" fill="#222">紅＝V / VCC（3.3V）</text>
<polyline points="70,930 120,930" fill="none" stroke="#222222" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="70" cy="930" r="4.5" fill="#222222" stroke="#000" stroke-width="1"/>
<circle cx="120" cy="930" r="4.5" fill="#222222" stroke="#000" stroke-width="1"/>
<text x="135" y="935" font-size="15" text-anchor="start" font-weight="normal" fill="#222">黑＝G / GND（地）</text>
<polyline points="70,960 120,960" fill="none" stroke="#8a6a00" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="70,960 120,960" fill="none" stroke="#E0A800" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="70" cy="960" r="4.5" fill="#E0A800" stroke="#000" stroke-width="1"/>
<circle cx="120" cy="960" r="4.5" fill="#E0A800" stroke="#000" stroke-width="1"/>
<text x="135" y="965" font-size="15" text-anchor="start" font-weight="normal" fill="#222">黃＝S / 訊號（OUT、CLK、DIO）</text>
<text x="135" y="990" font-size="12" text-anchor="start" font-weight="normal" fill="#777">（杜邦線顏色不限，照腳位插就好）</text>
<text x="560" y="868" font-size="18" text-anchor="start" font-weight="bold" fill="#222">使用順序</text>
<text x="560" y="900" font-size="15" text-anchor="start" font-weight="normal" fill="#222">① 跳帽設 3.3V → 杜邦線先插在模組排針上：OUT→G27 的 S、VCC→V、GND→G（AO 不接）</text>
<text x="560" y="926" font-size="15" text-anchor="start" font-weight="normal" fill="#222">② USB 接電腦 → Arduino IDE 開 opto_test_esp32.ino、開發板選 ESP32 Dev Module → 上傳（Connecting… 時按住 BOOT）</text>
<text x="560" y="952" font-size="15" text-anchor="start" font-weight="normal" fill="#222">③ 序列埠 115200 → 按 EN 重開：開機約 1 秒自動判定擋住電位，槽裡不能有東西</text>
<text x="560" y="978" font-size="15" text-anchor="start" font-weight="normal" fill="#222">④ 紙片擋住光束約 1 秒再拿開，確認判定沒反 → 輸入 v 看「■ 擋住／· 沒擋」→ 照《組裝與測試說明》第 7 節做 T1～T7</text>
<text x="560" y="1010" font-size="14" text-anchor="start" font-weight="bold" fill="#b00">注意：光耦 VCC 接 V（3.3V），不接 5V｜AO 不接｜這台不用 9V 和 DC 座｜不接 G0、G2、G5、G12、G15（板上 BOOT 鍵可以按）</text>
<text x="560" y="1038" font-size="12" text-anchor="start" font-weight="normal" fill="#777">程式：04_光耦測試原型/opto_test_esp32（c20＝丟 20 枚、e＝報告、v＝即時電位、p＝看抖動、?＝說明）</text>
</svg>
