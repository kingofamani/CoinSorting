<text x="830.0" y="42" font-size="30" text-anchor="middle" font-weight="bold" fill="#222">光耦簡易測試原型　接線圖（ESP32＋1 個槽型光耦）</text>
<text x="830.0" y="70" font-size="15" text-anchor="middle" font-weight="normal" fill="#555">ESP32（WROOM-32）＋ 38P 擴展板 ＋ 槽型光耦模組 ×1（LM393，槽寬 10 mm）＋（選用）4 位數七段顯示器 TM1637｜電源：電腦 USB（不用 9V）</text>
