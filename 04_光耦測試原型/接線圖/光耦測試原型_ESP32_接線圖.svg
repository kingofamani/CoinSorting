<text x="905" y="540" font-size="13" text-anchor="middle" font-weight="normal" fill="#f3d9f7">由上而下：藍 S（訊號）／紅 V（電源）／黑 G（地）；腳位名稱與順序以板上印字為準</text>
<text x="905" y="560" font-size="13" text-anchor="middle" font-weight="normal" fill="#f3d9f7">同一種 V（或 G）全部相通；這台只用 G27 那一欄（顯示器另用 G14、G13）</text>
